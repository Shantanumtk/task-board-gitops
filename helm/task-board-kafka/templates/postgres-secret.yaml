apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    {{- include "task-board-kafka.componentLabels" (dict "component" "postgres" "Chart" .Chart "Release" .Release) | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
