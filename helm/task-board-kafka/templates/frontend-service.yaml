apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "task-board-kafka.componentLabels" (dict "component" "frontend" "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app.kubernetes.io/component: frontend
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 80
