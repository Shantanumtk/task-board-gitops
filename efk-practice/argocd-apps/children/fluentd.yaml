# Official Fluent community Helm chart. Runs as a DaemonSet tailing every
# container's logs from /var/log/containers on the node and forwarding to
# Elasticsearch. Its default output config already targets
# "elasticsearch-master:9200" (matching the elasticsearch app's Service name)
# so no host/port override is needed — only resource sizing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluentd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluentd
    targetRevision: 0.5.3
    helm:
      values: |
        resources:
          requests:
            cpu: "100m"
            memory: "200Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"
        # verify_es_version_at_startup:false (the chart's own default) makes
        # the plugin ASSUME Elasticsearch major version 5 rather than detect
        # it, so it keeps sending a legacy _type field that ES 8.x rejects
        # outright (mapping types were removed in ES 7+) regardless of
        # suppress_type_name. Pinning default_elasticsearch_version to 8
        # fixes it without depending on ES being reachable at fluentd
        # startup. Full fileConfigs override needed since Helm can't patch
        # inside a literal config string.
        fileConfigs:
          04_outputs.conf: |-
            <label @OUTPUT>
              <match **>
                @type elasticsearch
                host "elasticsearch-master"
                port 9200
                path ""
                suppress_type_name true
                verify_es_version_at_startup false
                default_elasticsearch_version 8
              </match>
            </label>
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
