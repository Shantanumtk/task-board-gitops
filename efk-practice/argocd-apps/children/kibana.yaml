# Plain hand-written manifests instead of the official elastic/kibana chart.
# That chart's pre-install hook Job unconditionally tries to create an
# Elasticsearch service-account token over HTTPS (hardcoded), which only
# makes sense when xpack security is enabled — it fails outright against our
# security-disabled dev Elasticsearch. Kibana itself needs nothing more than
# ELASTICSEARCH_HOSTS pointed at the cluster, so a plain Deployment avoids
# that hook entirely.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kibana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Shantanumtk/task-board-gitops.git
    targetRevision: HEAD
    path: efk-practice/manifests/kibana
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
