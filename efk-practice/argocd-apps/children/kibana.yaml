# Official Elastic Kibana chart, pointed at the elasticsearch app's Service
# (elasticsearch-master, the chart's default naming for release "elasticsearch")
# over plain http since xpack security/TLS is disabled on that cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kibana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.elastic.co
    chart: kibana
    targetRevision: 8.5.1
    helm:
      values: |
        elasticsearchHosts: "http://elasticsearch-master:9200"
        # The chart's pre-install Job unconditionally mounts a secret named
        # by this key, even though we don't use TLS. createCert:false on the
        # elasticsearch app means the chart never creates this secret itself,
        # so we pre-create an empty placeholder with this exact name (see
        # deploy steps) rather than fight the chart's template.
        elasticsearchCertificateSecret: "elasticsearch-master-certs"
        replicas: 1
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
