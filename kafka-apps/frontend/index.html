<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Task Board — n-tier ArgoCD demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    #stats { color: #555; margin-bottom: 1rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    input { flex: 1; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; }
    li { padding: 0.4rem 0; border-bottom: 1px solid #eee; }
    .done { color: #2a2; }
    .pending { color: #a80; }
  </style>
</head>
<body>
  <h1>Task Board</h1>
  <div id="stats">loading stats…</div>
  <form id="task-form">
    <input id="title" placeholder="New task title" required />
    <button type="submit">Add</button>
  </form>
  <ul id="tasks"></ul>

  <script>
    async function refresh() {
      const [tasks, stats] = await Promise.all([
        fetch('/api/tasks').then(r => r.json()),
        fetch('/api/stats').then(r => r.json()),
      ]);
      document.getElementById('stats').textContent =
        `${stats.total} total, ${stats.processed} processed by worker`;
      document.getElementById('tasks').innerHTML = tasks.map(t =>
        `<li class="${t.processed ? 'done' : 'pending'}">#${t.id} — ${t.title} — ${t.processed ? 'processed' : 'queued'}</li>`
      ).join('');
    }

    document.getElementById('task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      });
      document.getElementById('title').value = '';
      refresh();
    });

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
